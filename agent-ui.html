<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5; --panel:#ffffff; --ink:#29261f; --muted:#7a766b; --line:#e8e4d9;
  --accent:#c4623f; --accent-ink:#ffffff; --accent-soft:#f1ebe0; --user:#f0ece1; --user-ink:#29261f;
  --ok:#4f9a6b; --radius:18px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
:root[data-theme="dark"]{
  --bg:#262624; --panel:#30302e; --ink:#ece9e1; --muted:#9b978c; --line:#403f3b;
  --accent:#d97757; --accent-ink:#262624; --accent-soft:#3a3835; --user:#3a3835; --user-ink:#ece9e1; --ok:#6bbf8a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:272px 1fr;height:100%}
/* sidebar */
.side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:16px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-size:18px;font-weight:600}
.brand b{display:block;font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.new{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-weight:500;text-align:left}
.new:hover{filter:brightness(.97)}
.hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.hist h4{font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 8px}
.hist button{text-align:left;padding:8px 10px;border-radius:9px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover{background:var(--bg)}
.hist button[aria-current="true"]{background:var(--accent-soft)}
.side-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;padding:0 6px}
.theme{padding:6px 10px;border:1px solid var(--line);border-radius:8px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:14px 24px;background:var(--bg)}
.top h1{font-size:14px;font-weight:500;color:var(--muted)}
.menu{display:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.thread{flex:1;overflow:auto;padding:28px 24px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.empty{text-align:center;padding-top:12vh}
.empty h2{font-family:var(--serif);font-size:40px;line-height:1.15;font-weight:400;letter-spacing:-.01em;margin:0 auto}
.empty p{color:var(--muted);margin:12px auto 24px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:transparent;padding:9px 16px;border-radius:12px;font-size:14px;color:var(--muted)}
.chip:hover{background:var(--accent-soft);color:var(--ink)}

.msg{display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.avatar{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-size:15px;font-weight:600}
.bubble{max-width:100%}
.user .bubble{background:var(--user);color:var(--user-ink);padding:11px 16px;border-radius:var(--radius);max-width:80%}
.agent .bubble{flex:1;min-width:0;padding-top:2px;font-size:15.5px;line-height:1.7}
.bubble p+p{margin-top:10px}
.bubble code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);padding:1px 6px;border-radius:5px}

/* steps: what the agent is doing */
.steps{border:1px solid var(--line);background:transparent;border-radius:12px;margin-bottom:12px;overflow:hidden}
.steps summary{list-style:none;cursor:pointer;padding:9px 13px;display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted)}
.steps summary::-webkit-details-marker{display:none}
.steps summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.steps[open] summary::after{transform:rotate(-135deg)}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 13px;border-top:1px solid var(--line);font-size:13.5px}
.step .st{flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.step.done .st{animation:none;border:0;background:var(--ok);position:relative}
.step.done .st::after{content:"";position:absolute;left:5px;top:2.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.step small{display:block;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* composer */
.composer{padding:0 24px 20px}
.box{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 12px 12px 20px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 2px 14px rgba(60,40,20,.07)}
.box:focus-within{border-color:var(--muted)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;max-height:160px;padding:6px 0}
textarea::placeholder{color:var(--muted)}
.send{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4;cursor:not-allowed}
.hint{max-width:720px;margin:8px auto 0;color:var(--muted);font-size:12.5px;text-align:center}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:5;transform:translateX(-100%);transition:transform .25s}
  .app.open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .menu{display:block}
  .thread{padding:20px 16px}.composer{padding:0 12px 14px}.top{padding:12px 16px}
  .empty h2{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Conversations">
    <div class="brand">
      <div class="logo">A</div>
      <div><b id="agentName">Your agent</b><span><i class="dot"></i>Online</span></div>
    </div>
    <button class="new" id="newBtn">New chat</button>
    <nav class="hist" id="hist"><h4>Recent</h4></nav>
    <div class="side-foot"><span>v1.0</span><button class="theme" id="themeBtn">Dark mode</button></div>
  </aside>

  <section class="main">
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="Open menu">Menu</button>
      <h1 id="title">New chat</h1>
    </header>
    <div class="thread" id="thread"><div class="col" id="col"></div></div>
    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask your agent anything" aria-label="Message"></textarea>
        <button class="send" id="send" aria-label="Send message" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <p class="hint">Enter to send, Shift+Enter for a new line</p>
    </div>
  </section>
</div>

<script>
/* ============ 1. CONFIG: edit these ============ */
const CONFIG = {
  name: "Cine & Weather",
  tagline: "Weather and movies, India",
  blurb: "Ask about the weather in any Indian city, or find movies by genre.",
  suggestions: ["Weather in Hyderabad", "Best comedy movies", "Sci-fi films and today's temperature in Mumbai in °F"]
};

/* ============ 2. BACKEND ADAPTER: replace this ============
   Call your agent here and report progress through `emit`:
     emit({type:"step",   id:"s1", label:"Searching docs", detail:"query: pricing"})
     emit({type:"step_done", id:"s1"})
     emit({type:"token",  text:"partial answer "})   // stream text
   Example with a real endpoint:
     const res = await fetch("/api/agent", {method:"POST",
       headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:history})});
     // read res.body and emit() each chunk
*/
const API_URL = location.protocol === "file:" ? "http://localhost:8000" : "";

async function runAgent(history, emit){
  const res = await fetch(API_URL + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({messages: history})
  });
  if (!res.ok || !res.body) throw new Error("Agent error");
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buf = "";
  while (true){
    const {done, value} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream:true});
    const lines = buf.split("\n"); buf = lines.pop();
    for (const line of lines) if (line.trim()) emit(JSON.parse(line));
  }
}

/* ============ 3. UI LOGIC ============ */
const $ = id => document.getElementById(id);
const col = $("col"), thread = $("thread"), input = $("input"), sendBtn = $("send");
let chats = [], current = null, busy = false;

$("agentName").textContent = CONFIG.name;
$("logoText")?.remove();
document.querySelector(".logo").textContent = CONFIG.name.trim()[0].toUpperCase();

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt = s => esc(s).split(/\n{2,}/).map(p => "<p>"+p.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>")+"</p>").join("");
const scroll = () => thread.scrollTo({top:thread.scrollHeight});

function showEmpty(){
  col.innerHTML = `<div class="empty"><h2>${esc(CONFIG.tagline)}</h2><p>${esc(CONFIG.blurb)}</p><div class="chips"></div></div>`;
  CONFIG.suggestions.forEach(t => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = t;
    b.onclick = () => submit(t); col.querySelector(".chips").appendChild(b);
  });
}
function newChat(){
  current = {id:Date.now(), title:"New chat", messages:[]};
  chats.unshift(current); $("title").textContent = current.title;
  showEmpty(); renderHist(); $("app").classList.remove("open");
}
function renderHist(){
  const h = $("hist"); h.innerHTML = "<h4>Recent</h4>";
  chats.filter(c => c.messages.length).forEach(c => {
    const b = document.createElement("button"); b.textContent = c.title;
    if (c === current) b.setAttribute("aria-current","true");
    b.onclick = () => openChat(c); h.appendChild(b);
  });
}
function openChat(c){
  current = c; $("title").textContent = c.title; col.innerHTML = "";
  c.messages.forEach(m => m.role === "user" ? addUser(m.content) : addAgent(m.content));
  renderHist(); $("app").classList.remove("open"); scroll();
}
function addUser(text){
  const d = document.createElement("div"); d.className = "msg user";
  d.innerHTML = `<div class="bubble">${esc(text)}</div>`; col.appendChild(d);
}
function addAgent(text){
  const d = document.createElement("div"); d.className = "msg agent";
  d.innerHTML = `<div class="avatar">${esc(CONFIG.name.trim()[0].toUpperCase())}</div><div class="bubble">${fmt(text)}</div>`;
  col.appendChild(d); return d.querySelector(".bubble");
}

async function submit(text){
  text = text.trim(); if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  if (!current.messages.length){ col.innerHTML = ""; current.title = text.slice(0,40); $("title").textContent = current.title; }
  current.messages.push({role:"user", content:text}); addUser(text); renderHist();
  input.value = ""; input.style.height = "auto";

  const bubble = addAgent(""); let steps = null, list = null, answer = "", body = null;
  const stepEls = {};
  const ensureSteps = () => {
    if (steps) return;
    steps = document.createElement("details"); steps.className = "steps"; steps.open = true;
    steps.innerHTML = `<summary>Working on it</summary>`; bubble.prepend(steps);
  };
  const emit = ev => {
    if (ev.type === "step"){
      ensureSteps();
      const s = document.createElement("div"); s.className = "step";
      s.innerHTML = `<i class="st"></i><div>${esc(ev.label)}${ev.detail ? `<small>${esc(ev.detail)}</small>` : ""}</div>`;
      steps.appendChild(s); stepEls[ev.id] = s;
    } else if (ev.type === "step_done"){
      stepEls[ev.id]?.classList.add("done");
      if (Object.values(stepEls).every(e => e.classList.contains("done"))) steps.querySelector("summary").textContent = Object.keys(stepEls).length + " steps completed";
    } else if (ev.type === "token"){
      if (!body){ body = document.createElement("div"); bubble.appendChild(body); }
      answer += ev.text; body.innerHTML = fmt(answer); body.classList.add("cursor");
      steps && (steps.open = false);
    }
    scroll();
  };
  try { await runAgent(current.messages, emit); }
  catch (e){ if (!body){ body = document.createElement("div"); bubble.appendChild(body); }
    answer = "Something went wrong reaching the agent. Check your connection and try again."; body.innerHTML = fmt(answer); }
  body?.classList.remove("cursor");
  current.messages.push({role:"agent", content:answer});
  busy = false; sendBtn.disabled = !input.value.trim(); input.focus();
}

input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = input.scrollHeight + "px";
  sendBtn.disabled = busy || !input.value.trim();
});
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submit(input.value); } });
sendBtn.onclick = () => submit(input.value);
$("newBtn").onclick = newChat;
$("menuBtn").onclick = () => $("app").classList.toggle("open");

/* theme */
const root = document.documentElement;
const setTheme = t => { root.dataset.theme = t; $("themeBtn").textContent = t === "dark" ? "Light mode" : "Dark mode"; };
setTheme(matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
$("themeBtn").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

newChat();
</script>
</body>
</html>
